<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lebenssimulation - Phase 1</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1d23;
    overflow: hidden;
    height: 100%;
  }
  #hud {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #e8e8e8;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    z-index: 10;
    background: rgba(0, 0, 0, 0.45);
    padding: 8px 12px;
    border-radius: 6px;
    pointer-events: none;
  }
  #joinOverlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 14, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #joinBox {
    background: #22262f;
    padding: 28px 32px;
    border-radius: 10px;
    color: #e8e8e8;
    font-family: system-ui, sans-serif;
    text-align: center;
    min-width: 260px;
  }
  #joinBox h2 { margin-top: 0; font-weight: 600; }
  #joinBox input {
    padding: 9px 10px;
    border-radius: 4px;
    border: 1px solid #3a3f4b;
    background: #1a1d23;
    color: #e8e8e8;
    margin-bottom: 12px;
    width: 100%;
    box-sizing: border-box;
    font-size: 14px;
  }
  #joinBox button {
    padding: 9px 20px;
    border-radius: 4px;
    border: none;
    background: #4a7cff;
    color: white;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
  }
  #joinBox button:hover { background: #3a6ceb; }
  #joinMsg { color: #ff8080; min-height: 1.2em; font-size: 13px; margin-top: 10px; margin-bottom: 0; }
  canvas { display: block; }

  #touchControls {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 10;
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 6px;
    user-select: none;
    -webkit-user-select: none;
  }
  .dpad-btn {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 10px;
    color: #e8e8e8;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .dpad-btn.active { background: rgba(74, 124, 255, 0.55); }
  #dpadUp { grid-column: 2; grid-row: 1; }
  #dpadLeft { grid-column: 1; grid-row: 2; }
  #dpadRight { grid-column: 3; grid-row: 2; }
  #dpadDown { grid-column: 2; grid-row: 3; }

  #eventBanner {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    background: #22262f;
    border: 1px solid #3a3f4b;
    border-radius: 10px;
    padding: 14px 18px;
    color: #e8e8e8;
    font-family: system-ui, sans-serif;
    min-width: 260px;
    max-width: min(90vw, 380px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  #eventBanner h3 { margin: 0 0 6px 0; font-size: 15px; }
  #eventBanner p { margin: 0 0 10px 0; font-size: 13px; color: #c7ccd6; }
  #eventChoices { display: flex; gap: 8px; flex-wrap: wrap; }
  #eventChoices button {
    padding: 7px 14px;
    border-radius: 6px;
    border: none;
    background: #4a7cff;
    color: white;
    cursor: pointer;
    font-size: 13px;
  }
  #eventChoices button:hover { background: #3a6ceb; }
  #eventTimerTrack {
    margin-top: 10px;
    height: 4px;
    background: #3a3f4b;
    border-radius: 2px;
    overflow: hidden;
  }
  #eventTimerFill {
    height: 100%;
    background: #4a7cff;
    width: 100%;
  }

  #loadingScreen {
    position: fixed;
    inset: 0;
    background: #1a1d23;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 25;
    color: #e8e8e8;
    font-family: system-ui, sans-serif;
  }
  #loadingSpinner {
    width: 44px;
    height: 44px;
    border: 3px solid #3a3f4b;
    border-top-color: #4a7cff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingTitle { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  #loadingHint { font-size: 13px; color: #9aa0ab; text-align: center; max-width: 300px; line-height: 1.5; }

  #marketBtn {
    position: fixed; top: 10px; right: 10px; z-index: 10;
    background: rgba(0, 0, 0, 0.45); color: #e8e8e8; border: 1px solid #3a3f4b;
    border-radius: 6px; padding: 8px 12px; font-family: system-ui, sans-serif;
    font-size: 13px; cursor: pointer;
  }
  #marketPanel {
    position: fixed; top: 50px; right: 10px; width: min(340px, 90vw);
    max-height: 70vh; overflow-y: auto; background: #22262f; border: 1px solid #3a3f4b;
    border-radius: 10px; padding: 14px; z-index: 15; color: #e8e8e8;
    font-family: system-ui, sans-serif; font-size: 13px;
  }
  #marketPanel h4 { margin: 14px 0 8px 0; font-size: 14px; }
  #marketPanel h4:first-child { margin-top: 0; }
  .market-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid #2a2f3a;
  }
  .market-item:last-child { border-bottom: none; }
  .market-item-name { font-weight: 600; }
  .market-item-detail { color: #9aa0ab; font-size: 11px; }
  .market-btn-small {
    padding: 6px 10px; border-radius: 6px; border: none; background: #4a7cff;
    color: white; cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .market-btn-small.danger { background: #e05a5a; }
  .market-btn-small.ghost { background: #3a3f4b; }
  .market-empty { color: #6a7080; font-size: 12px; padding: 4px 0; }
  #foundCompanyRow { display: flex; gap: 6px; margin-bottom: 10px; }
  #foundCompanyRow input {
    flex: 1; padding: 7px 8px; border-radius: 4px; border: 1px solid #3a3f4b;
    background: #1a1d23; color: #e8e8e8; font-size: 12px;
  }
  #actionToast {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: #22262f; border: 1px solid #3a3f4b; color: #e8e8e8; font-size: 13px;
    padding: 9px 16px; border-radius: 8px; z-index: 30; display: none;
    font-family: system-ui, sans-serif;
  }
</style>
</head>
<body>
  <div id="loadingScreen">
    <div id="loadingSpinner"></div>
    <div id="loadingTitle">Welt wird geladen...</div>
    <div id="loadingHint">Beim ersten Start kann das bis zu einer Minute dauern, weil der Server aufwacht.</div>
  </div>

  <div id="joinOverlay">
    <div id="joinBox">
      <h2>Neues Leben beginnen</h2>
      <input id="nameInput" type="text" placeholder="Name" maxlength="20" autocomplete="off">
      <button id="joinBtn">Verbinden</button>
      <p id="joinMsg"></p>
    </div>
  </div>

  <div id="hud"></div>
  <div id="eventBanner" style="display:none;">
    <h3 id="eventTitle"></h3>
    <p id="eventText"></p>
    <div id="eventChoices"></div>
    <div id="eventTimerTrack"><div id="eventTimerFill"></div></div>
  </div>
  <div id="touchControls">
    <button id="dpadUp" class="dpad-btn">&#8593;</button>
    <button id="dpadLeft" class="dpad-btn">&#8592;</button>
    <button id="dpadRight" class="dpad-btn">&#8594;</button>
    <button id="dpadDown" class="dpad-btn">&#8595;</button>
  </div>

  <button id="marketBtn">🏦 Markt</button>
  <div id="marketPanel" style="display:none;">
    <h4>Immobilien</h4>
    <div id="propertyList"></div>

    <h4>Meine Firmen</h4>
    <div id="foundCompanyRow">
      <input id="companyNameInput" type="text" placeholder="Firmenname" maxlength="30">
      <button class="market-btn-small" id="foundCompanyBtn">Gründen ($500)</button>
    </div>
    <div id="companyList"></div>

    <h4>Eingehende Angebote</h4>
    <div id="tradeList"></div>
  </div>
  <div id="actionToast"></div>

  <canvas id="gameCanvas"></canvas>

  <div id="debugError" style="display:none; position:fixed; bottom:10px; right:10px; max-width:80vw;
    background:#3a1a1a; color:#ffb0b0; font-size:11px; padding:8px 10px; border-radius:6px;
    z-index:30; font-family:monospace; white-space:pre-wrap;"></div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="net.js"></script>
  <script src="render.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');

    // Sichtbare Fehleranzeige: falls irgendwas schiefgeht (z.B. Three.js laedt nicht),
    // sieht man das direkt auf dem Bildschirm statt vor einem reaktionslosen Knopf zu sitzen.
    function showDebugError(message) {
      const el = document.getElementById('debugError');
      el.textContent = message;
      el.style.display = 'block';
      console.error(message);
    }
    window.addEventListener('error', (e) => {
      showDebugError('Fehler: ' + (e.message || 'unbekannt'));
    });

    // NetClient zuerst - hat keine Abhaengigkeit zu Three.js, sollte praktisch nie fehlschlagen.
    let net = null;
    try {
      net = new NetClient();
    } catch (err) {
      showDebugError('Verbindungsaufbau fehlgeschlagen: ' + err.message);
    }

    // Join-Button WIRD IMMER ZUERST scharf geschaltet, unabhaengig davon, ob die
    // 3D-Grafik weiter unten erfolgreich startet. So bleibt "Verbinden" garantiert
    // klickbar, selbst wenn Three.js aus irgendeinem Grund nicht laedt.
    const joinOverlay = document.getElementById('joinOverlay');
    const joinBtn = document.getElementById('joinBtn');
    const nameInput = document.getElementById('nameInput');
    const joinMsg = document.getElementById('joinMsg');

    joinBtn.addEventListener('click', () => {
      if (!net) {
        joinMsg.textContent = 'Verbindung nicht verfuegbar - siehe Fehlermeldung unten rechts.';
        return;
      }
      const name = nameInput.value.trim() || 'Spieler';
      joinMsg.textContent = '';
      showLoading('Verbinde mit der Welt...', 'Falls der Server geschlafen hat, dauert das bis zu einer Minute.');
      net.connect(name);
    });
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinBtn.click();
    });

    // 3D-Grafik erst JETZT aufbauen, abgesichert - ein Fehler hier darf den Rest
    // der Seite (Verbinden-Knopf, Events) nicht mit runterreissen.
    let renderer = null;
    try {
      if (typeof THREE === 'undefined') {
        throw new Error('Three.js wurde nicht geladen (CDN nicht erreichbar oder blockiert)');
      }
      renderer = new Renderer(canvas, net);
    } catch (err) {
      showDebugError('3D-Grafik konnte nicht gestartet werden: ' + err.message);
    }

    // Ladebildschirm: verschwindet, sobald alles aufgebaut ist. Erscheint erneut
    // waehrend des Verbindens, weil der Gratis-Server nach Inaktivitaet erst
    // aufwachen muss (bis zu ~1 Minute) - ohne Anzeige wirkt das wie ein Absturz.
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingTitle = document.getElementById('loadingTitle');
    const loadingHint = document.getElementById('loadingHint');

    function showLoading(title, hint) {
      loadingTitle.textContent = title;
      loadingHint.textContent = hint;
      loadingScreen.style.display = 'flex';
    }
    function hideLoading() {
      loadingScreen.style.display = 'none';
    }

    hideLoading(); // Aufbau abgeschlossen - Namenseingabe freigeben

    if (net) {
      net.onWelcome = () => {
        hideLoading();
        joinOverlay.style.display = 'none';
        if (renderer) renderer.start();
      };
      net.onJoinError = (reason) => {
        // Ladebildschirm MUSS hier weg, sonst haengt der Nutzer vor einem
        // ewig drehenden Rad und sieht die eigentliche Fehlermeldung nie.
        hideLoading();
        joinMsg.textContent =
          reason === 'lobby_full'
            ? 'Diese Welt ist voll (max. 20 Spieler). Bitte später erneut versuchen.'
            : 'Verbindung fehlgeschlagen.';
      };
      net.onConnectionLost = () => {
        // Nur anzeigen, wenn das Spiel bereits lief - beim ersten Verbindungsversuch
        // uebernimmt stattdessen onJoinError die Rueckmeldung.
        if (net.myId != null) {
          showLoading('Verbindung verloren', 'Versuche automatisch neu zu verbinden...');
        }
      };
    }

    // Touch-Steuerkreuz: setzt dieselben keys wie WASD, funktioniert also
    // gleichzeitig mit einer angeschlossenen Tastatur (z.B. iPad-Keyboard-Case).
    function bindDpadButton(elementId, keyName) {
      const el = document.getElementById(elementId);
      const press = (e) => {
        e.preventDefault();
        if (net) net.setKey(keyName, true);
        el.classList.add('active');
      };
      const release = (e) => {
        e.preventDefault();
        if (net) net.setKey(keyName, false);
        el.classList.remove('active');
      };
      el.addEventListener('pointerdown', press);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
      el.addEventListener('pointerleave', release);
    }
    bindDpadButton('dpadUp', 'w');
    bindDpadButton('dpadLeft', 'a');
    bindDpadButton('dpadRight', 'd');
    bindDpadButton('dpadDown', 's');

    // Lebensereignisse: Banner mit Countdown, wird vom Server per 'eventOffer' ausgeloest.
    // Reagiert der Spieler nicht innerhalb der Zeit, loest der SERVER die Standardwahl aus
    // und schickt 'eventResolved' - das Banner wird so oder so ausgeblendet.
    const eventBanner = document.getElementById('eventBanner');
    const eventTitleEl = document.getElementById('eventTitle');
    const eventTextEl = document.getElementById('eventText');
    const eventChoicesEl = document.getElementById('eventChoices');
    const eventTimerFillEl = document.getElementById('eventTimerFill');
    let eventTimerHandle = null;

    if (net) {
      net.onEventOffer = (msg) => showEventBanner(msg);
      net.onEventResolved = () => hideEventBanner();
    }

    function showEventBanner(msg) {
      eventTitleEl.textContent = msg.title;
      eventTextEl.textContent = msg.text;
      eventChoicesEl.innerHTML = '';
      msg.choices.forEach((choice) => {
        const btn = document.createElement('button');
        btn.textContent = choice.label;
        btn.addEventListener('click', () => {
          net.chooseEventOption(choice.index);
          hideEventBanner();
        });
        eventChoicesEl.appendChild(btn);
      });
      eventBanner.style.display = 'block';
      startEventTimer(msg.expiresAt);
    }

    function hideEventBanner() {
      eventBanner.style.display = 'none';
      if (eventTimerHandle) cancelAnimationFrame(eventTimerHandle);
    }

    function startEventTimer(expiresAt) {
      const total = expiresAt - Date.now();
      function tick() {
        const remaining = expiresAt - Date.now();
        const pct = Math.max(0, Math.min(1, remaining / total));
        eventTimerFillEl.style.width = (pct * 100) + '%';
        if (remaining > 0) eventTimerHandle = requestAnimationFrame(tick);
      }
      tick();
    }

    // ---------------------------------------------------------------------
    // Wirtschaft: Markt-Panel, Firmen, Handel
    // ---------------------------------------------------------------------
    const marketBtn = document.getElementById('marketBtn');
    const marketPanel = document.getElementById('marketPanel');
    const propertyListEl = document.getElementById('propertyList');
    const companyListEl = document.getElementById('companyList');
    const tradeListEl = document.getElementById('tradeList');
    const companyNameInput = document.getElementById('companyNameInput');
    const foundCompanyBtn = document.getElementById('foundCompanyBtn');
    const actionToast = document.getElementById('actionToast');

    let toastTimeout = null;
    function showToast(message) {
      actionToast.textContent = message;
      actionToast.style.display = 'block';
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { actionToast.style.display = 'none'; }, 3000);
    }

    marketBtn.addEventListener('click', () => {
      const opening = marketPanel.style.display === 'none';
      marketPanel.style.display = opening ? 'block' : 'none';
      if (opening) renderMarketPanel();
    });

    function playerName(playerId) {
      const p = net.players.get(playerId);
      return p ? p.name : ('Spieler #' + playerId);
    }

    function renderMarketPanel() {
      if (!net) return;

      // Immobilien
      propertyListEl.innerHTML = '';
      if (net.properties.size === 0) {
        propertyListEl.innerHTML = '<div class="market-empty">Lädt...</div>';
      }
      for (const prop of net.properties.values()) {
        const row = document.createElement('div');
        row.className = 'market-item';

        const info = document.createElement('div');
        const isMine = prop.ownerId === net.myId;
        const ownerText = !prop.ownerId ? 'frei' : (isMine ? 'dir gehörend' : playerName(prop.ownerId) + ' gehörend');
        info.innerHTML =
          `<div class="market-item-name">${prop.name}</div>` +
          `<div class="market-item-detail">$${prop.price} · +${prop.incomePerTick}/-${prop.maintenancePerTick} pro Tick · ${ownerText}</div>`;
        row.appendChild(info);

        const btn = document.createElement('button');
        btn.className = 'market-btn-small';
        if (!prop.ownerId) {
          btn.textContent = 'Kaufen';
          btn.addEventListener('click', () => net.buyProperty(prop.id));
        } else if (isMine) {
          btn.textContent = 'Verkaufen';
          btn.classList.add('danger');
          btn.addEventListener('click', () => net.sellProperty(prop.id));
        } else {
          btn.textContent = 'Angebot machen';
          btn.classList.add('ghost');
          btn.addEventListener('click', () => {
            const price = window.prompt(`Preisangebot an ${playerName(prop.ownerId)} für "${prop.name}":`, prop.price);
            const parsed = Number(price);
            if (price != null && Number.isFinite(parsed) && parsed >= 0) {
              net.proposeTrade(prop.ownerId, prop.id, parsed);
              showToast('Angebot gesendet.');
            }
          });
        }
        row.appendChild(btn);
        propertyListEl.appendChild(row);
      }

      // Firmen (nur eigene)
      companyListEl.innerHTML = '';
      const myCompanies = [...net.companies.values()].filter((c) => c.ownerId === net.myId);
      if (myCompanies.length === 0) {
        companyListEl.innerHTML = '<div class="market-empty">Noch keine eigene Firma.</div>';
      }
      for (const company of myCompanies) {
        const row = document.createElement('div');
        row.className = 'market-item';
        row.innerHTML = `<div class="market-item-name">${company.name}</div>`;
        const btn = document.createElement('button');
        btn.className = 'market-btn-small danger';
        btn.textContent = 'Schließen';
        btn.addEventListener('click', () => net.closeCompany(company.id));
        row.appendChild(btn);
        companyListEl.appendChild(row);
      }

      // Eingehende Handelsangebote
      tradeListEl.innerHTML = '';
      if (net.incomingTrades.size === 0) {
        tradeListEl.innerHTML = '<div class="market-empty">Keine offenen Angebote.</div>';
      }
      for (const trade of net.incomingTrades.values()) {
        const row = document.createElement('div');
        row.className = 'market-item';
        row.innerHTML =
          `<div><div class="market-item-name">${trade.propertyName}</div>` +
          `<div class="market-item-detail">Angebot von ${playerName(trade.fromPlayerId)}: $${trade.price}</div></div>`;
        const btnGroup = document.createElement('div');
        btnGroup.style.display = 'flex';
        btnGroup.style.gap = '6px';

        const acceptBtn = document.createElement('button');
        acceptBtn.className = 'market-btn-small';
        acceptBtn.textContent = 'Annehmen';
        acceptBtn.addEventListener('click', () => { net.respondTrade(trade.tradeId, true); renderMarketPanel(); });

        const rejectBtn = document.createElement('button');
        rejectBtn.className = 'market-btn-small ghost';
        rejectBtn.textContent = 'Ablehnen';
        rejectBtn.addEventListener('click', () => { net.respondTrade(trade.tradeId, false); renderMarketPanel(); });

        btnGroup.appendChild(acceptBtn);
        btnGroup.appendChild(rejectBtn);
        row.appendChild(btnGroup);
        tradeListEl.appendChild(row);
      }
    }

    foundCompanyBtn.addEventListener('click', () => {
      const name = companyNameInput.value.trim() || 'Neue Firma';
      net.foundCompany(name);
      companyNameInput.value = '';
    });

    if (net) {
      net.onEconomyState = () => {
        if (marketPanel.style.display !== 'none') renderMarketPanel();
      };
      net.onTradeOffer = () => {
        showToast('Neues Handelsangebot erhalten - im Markt-Menü ansehen.');
        if (marketPanel.style.display !== 'none') renderMarketPanel();
      };
      net.onTradeResolved = (msg) => {
        if (msg.timedOut) showToast('Ein Handelsangebot ist abgelaufen.');
        else showToast(msg.accepted ? 'Handel abgeschlossen.' : 'Handel abgelehnt.');
        if (marketPanel.style.display !== 'none') renderMarketPanel();
      };
      net.onActionError = (msg) => {
        const reasons = {
          insufficient_funds: 'Nicht genug Geld.',
          already_owned: 'Bereits im Besitz von jemand anderem.',
          not_owner: 'Gehört dir nicht.',
          not_found: 'Nicht gefunden.',
          no_longer_owned: 'Gehört dem Verkäufer nicht mehr.',
        };
        showToast(reasons[msg.reason] || ('Aktion fehlgeschlagen: ' + msg.reason));
      };
      net.onPropertyRepossessed = (msg) => {
        showToast(`"${msg.propertyName}" wurde zwangsversteigert - Instandhaltung nicht bezahlbar.`);
      };
    }
  </script>
</body>
</html>
